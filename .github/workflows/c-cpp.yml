name: C/C++ CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 编译检查所有 C++ 文件
        run: |
          for f in *.cpp; do
            echo "==> 编译 $f"
            g++ -std=c++17 -Wall -Wextra -O2 "$f" -o /tmp/check.out || exit 1
          done
          echo "全部编译通过"